name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executables
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build
        shell: cmd
        run: build_msvc.bat

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "dist\receiver.exe"
            "dist\sender.exe"
          )

          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected build output was not found: $file"
            }
          }

          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }

          Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Value $checksums -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-keyboard-sharing-windows-${{ github.sha }}
          path: |
            dist/sender.exe
            dist/receiver.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lean-keyboard-sharing-windows-${{ github.sha }}
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist\sender.exe" "dist\receiver.exe" "dist\SHA256SUMS.txt" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "dist\sender.exe" "dist\receiver.exe" "dist\SHA256SUMS.txt" --verify-tag --generate-notes --title $tag --repo $env:GITHUB_REPOSITORY
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
